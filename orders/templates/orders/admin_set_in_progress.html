{% extends "orders/base.html" %}

{% block content %}
  <div class="row justify-content-center">
      <div class="col-md-6">
          <div class="card mt-5 border-warning">
              <div class="card-header bg-warning text-dark">
                  <h4 class="mb-0">Взять в работу: {{ order.title }}</h4>
              </div>
              <div class="card-body">
                  <form method="post">
                      {% csrf_token %}
                      <div class="mb-3">
                          <label class="form-label">Комментарий (обязательно)</label>
                          <textarea name="comment" class="form-control" rows="4" required></textarea>
                      </div>
                      <button type="submit" class="btn btn-warning">Принять в работу</button>
                      <a href="{% url 'admin_panel' %}" class="btn btn-secondary">Отмена</a>
                  </form>
              </div>
          </div>
      </div>
  </div>
{% endblock %}
