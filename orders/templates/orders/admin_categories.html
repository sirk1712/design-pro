{% extends "orders/base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Управление категориями</h2>
      <div>
          <a href="{% url 'add_category' %}" class="btn btn-success">Добавить категорию</a>
          <a href="{% url 'admin_panel' %}" class="btn btn-secondary">Назад к заявкам</a>
      </div>
  </div>

  <ul class="list-group">
      {% for category in categories %}
          <li class="list-group-item d-flex justify-content-between align-items-center">
              {{ category.name }}
              <a href="{% url 'delete_category' category.pk %}" class="btn btn-sm btn-danger">Удалить</a>
          </li>
      {% empty %}
          <li class="list-group-item">Категорий пока нет.</li>
      {% endfor %}
  </ul>
{% endblock %}
