{% extends "orders/base.html" %}

{% block content %}
  <div class="row justify-content-center">
      <div class="col-md-4">
          <div class="card mt-5">
              <div class="card-header bg-success text-white">
                  <h4 class="mb-0">Вход в систему</h4>
              </div>
              <div class="card-body">
                  <!-- Вывод ошибки "Неверный логин или пароль" -->
                  {% if messages %}
                      {% for message in messages %}
                          <div class="alert alert-danger">{{ message }}</div>
                      {% endfor %}
                  {% endif %}

                  <form method="post">
                      {% csrf_token %}
                      {% for field in form %}
                          <div class="mb-3">
                              <label class="form-label">{{ field.label }}</label>
                              {{ field }}
                          </div>
                      {% endfor %}
                      <button type="submit" class="btn btn-success w-100 mt-3">Войти</button>
                  </form>
              </div>
          </div>
      </div>
  </div>
{% endblock %}
